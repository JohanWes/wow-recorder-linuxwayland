name: CI

on:
  push:
  pull_request:

concurrency:
  group: warcraft-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Guard pro-free fork
        run: bash scripts/check-no-pro.sh

      - name: Guard Windows-free fork
        run: bash scripts/check-no-windows.sh

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check backend
        working-directory: src-tauri
        run: cargo check

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          cp "$artifact" /tmp/WarcraftRecorder.AppImage
          (cd /tmp && sha256sum WarcraftRecorder.AppImage > WarcraftRecorder.AppImage.sha256)
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          short_sha="${GITHUB_SHA::7}"
          tag="linux-${version}-${short_sha}"
          gh release create "$tag" \
            /tmp/WarcraftRecorder.AppImage \
            /tmp/WarcraftRecorder.AppImage.sha256 \
            --target "$GITHUB_SHA" \
            --title "Warcraft Recorder Linux ${version} (${short_sha})" \
            --notes "Automated Linux/Wayland Tauri release for commit ${GITHUB_SHA}." \
            --latest
