name: Warcraft Recorder CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: warcraft-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node JS
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Guard pro-free fork
      run: bash scripts/check-no-pro.sh

    - name: Guard Windows-free fork
      run: bash scripts/check-no-windows.sh

    - name: Typecheck
      run: npm run typecheck

    - name: Run unit tests
      run: npm test

    - name: Build bundles
      run: npm run build

  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install native development packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.93.1
        components: clippy, rustfmt

    - name: Check native package
      run: |
        cargo fmt --manifest-path native/Cargo.toml --check
        cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
        cargo test --manifest-path native/Cargo.toml --all-targets
        cargo build --manifest-path native/Cargo.toml --release

  release:
    needs: [validate, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node JS
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Cache electron-builder binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/electron-builder
        key: electron-builder-${{ runner.os }}-${{ runner.arch }}

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2

    - name: Install deps
      run: npm ci

    - name: Build AppImage
      run: npm run package:linux

    - name: Prepare release assets
      id: assets
      shell: bash
      run: |
        set -euo pipefail

        found="$(ls -1 release/build/WarcraftRecorder-*.AppImage | head -n 1 || true)"
        if [ -z "${found}" ]; then
          echo "No AppImage found in release/build/." >&2
          ls -la release/build || true
          exit 1
        fi

        cp -a "${found}" /tmp/WarcraftRecorder.AppImage
        sha256sum /tmp/WarcraftRecorder.AppImage > /tmp/WarcraftRecorder.AppImage.sha256

        version="$(node -p "require('./release/app/package.json').version")"
        short_sha="${GITHUB_SHA::7}"
        tag="linux-${version}-${short_sha}"

        {
          echo "tag=${tag}"
          echo "title=Warcraft Recorder Linux ${version} (${short_sha})"
          echo "short_sha=${short_sha}"
        } >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        tag="${{ steps.assets.outputs.tag }}"
        title="${{ steps.assets.outputs.title }}"

        cat > /tmp/release-notes.md <<EOF
        Automated Linux release for commit ${GITHUB_SHA}.

        Download:
        - WarcraftRecorder.AppImage
        - WarcraftRecorder.AppImage.sha256

        Validation completed before packaging:
        - pro-free fork guard
        - Windows-free fork guard
        - TypeScript typecheck
        - unit tests
        - production bundle build
        - native format, Clippy, tests, and release build
        EOF

        if gh release view "${tag}" >/dev/null 2>&1; then
          gh release edit "${tag}" \
            --title "${title}" \
            --notes-file /tmp/release-notes.md \
            --latest
          gh release upload "${tag}" \
            /tmp/WarcraftRecorder.AppImage \
            /tmp/WarcraftRecorder.AppImage.sha256 \
            --clobber
        else
          gh release create "${tag}" \
            /tmp/WarcraftRecorder.AppImage \
            /tmp/WarcraftRecorder.AppImage.sha256 \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file /tmp/release-notes.md \
            --latest
        fi
