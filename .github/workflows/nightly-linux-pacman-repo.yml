name: Nightly (Linux pacman repo)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Auto-rebase on upstream']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: nightly-linux-pacman-repo
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute pkgver
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          base="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "${base}" ]; then
            base="${base#v}"
          else
            base="0.0.0"
          fi

          count="$(git rev-list --count HEAD)"
          sha="$(git rev-parse --short=7 HEAD)"

          pkgver="${base}.r${count}.g${sha}"
          pkgver="${pkgver//-/.}"
          echo "pkgver=${pkgver}" >> "$GITHUB_OUTPUT"

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install deps
        run: npm ci

      - name: Build AppImage
        run: npm run package:linux

      - name: Prepare AppImage
        id: appimage
        shell: bash
        run: |
          set -euo pipefail
          found="$(ls -1 release/build/WarcraftRecorder-*.AppImage | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "No AppImage found in release/build/." >&2
            ls -la release/build || true
            exit 1
          fi

          out="/tmp/WarcraftRecorder.AppImage"
          cp -a "${found}" "${out}"
          sha="$(sha256sum "${out}" | awk '{print $1}')"

          echo "path=${out}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Ensure nightly GitHub Release exists (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            exit 0
          fi
          gh release create nightly --prerelease --title "Nightly" --notes "Automated nightly builds."

      - name: Upload AppImage to nightly Release (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp -a "${{ steps.appimage.outputs.path }}" "/tmp/WarcraftRecorder-nightly.AppImage"
          gh release upload nightly "/tmp/WarcraftRecorder-nightly.AppImage" --clobber

      - name: Render pacman package tree
        id: pkg_tree
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          icon_sha256="$(sha256sum assets/icon.png | awk '{print $1}')"
          out="/tmp/pkg-${{ steps.vars.outputs.pkgver }}"
          bash scripts/pacman/render-pkgbuild.sh \
            "${{ steps.vars.outputs.pkgver }}" \
            "${{ github.repository_owner }}" \
            "${repo_name}" \
            "${{ steps.appimage.outputs.sha256 }}" \
            "${icon_sha256}" \
            "${out}" \
            "${{ steps.appimage.outputs.path }}"
          echo "out=${out}" >> "$GITHUB_OUTPUT"

      - name: Build pacman package (container)
        id: makepkg
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.pkg_tree.outputs.out }}"
          docker run --rm \
            -v "${out}:/pkg" \
            -w /pkg \
            archlinux:base-devel \
            bash -lc "set -euo pipefail; pacman -Sy --noconfirm --needed pacman-contrib; useradd -m builder; chown -R builder:builder /pkg; su builder -c 'makepkg -sf --noconfirm'; ls -1 *.pkg.tar.* | head -n 1"

          pkgfile="$(ls -1 "${out}"/*.pkg.tar.* | head -n 1)"
          echo "pkgfile=${pkgfile}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Prepare repo directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gh-pages/repo/x86_64

      - name: Update repo db (container)
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$(realpath gh-pages/repo/x86_64)"
          cp -a "${{ steps.makepkg.outputs.pkgfile }}" "${repo_dir}/"

          docker run --rm \
            -v "${repo_dir}:/repo" \
            -w /repo \
            archlinux:base-devel \
            bash -lc "set -euo pipefail; pacman -Sy --noconfirm --needed pacman-contrib; repo-add -R -n warcraft-recorder-linux.db.tar.gz ./*.pkg.tar.*"

      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes."
            exit 0
          fi
          git commit -m "repo: ${GITHUB_SHA}"
          git push

