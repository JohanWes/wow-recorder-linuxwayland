name: Nightly (Linux pacman repo)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Auto-rebase on upstream']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: nightly-linux-pacman-repo
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute pkgver
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          # Use the app version as the base (avoid non-semver tags like `pacman`/`nightly`).
          base="$(python3 -c "import json; print(json.load(open('release/app/package.json')).get('version',''))" 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            base="0.0.0"
          fi

          count="$(git rev-list --count HEAD)"
          sha="$(git rev-parse --short=7 HEAD)"

          pkgver="${base}.r${count}.g${sha}"
          pkgver="${pkgver//-/.}"
          echo "pkgver=${pkgver}" >> "$GITHUB_OUTPUT"

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install deps
        run: npm ci

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run package:linux; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "AppImage build failed; retrying (${attempt}/3)."
            sleep 10
          done

      - name: Prepare AppImage
        id: appimage
        shell: bash
        run: |
          set -euo pipefail
          found="$(ls -1 release/build/WarcraftRecorder-*.AppImage | head -n 1 || true)"
          if [ -z "${found}" ]; then
            echo "No AppImage found in release/build/." >&2
            ls -la release/build || true
            exit 1
          fi

          out="/tmp/WarcraftRecorder.AppImage"
          cp -a "${found}" "${out}"
          sha="$(sha256sum "${out}" | awk '{print $1}')"

          echo "path=${out}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Ensure nightly GitHub Release exists (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            # Ensure existing release is not stuck as draft (fork token workaround)
            if [ "$(gh release view nightly --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit nightly --draft=false
            fi
            exit 0
          fi
          git tag -f nightly
          git push -f origin nightly
          gh release create nightly --prerelease --title "Nightly" --notes "Automated nightly builds." --verify-tag
          # Fork GITHUB_TOKEN may still create a draft; ensure published
          gh release edit nightly --draft=false 2>/dev/null || true

      - name: Upload AppImage to nightly Release (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp -a "${{ steps.appimage.outputs.path }}" "/tmp/WarcraftRecorder-nightly.AppImage"
          gh release upload nightly "/tmp/WarcraftRecorder-nightly.AppImage" --clobber

      - name: Render pacman package tree
        id: pkg_tree
        shell: bash
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          icon_sha256="$(sha256sum assets/icon.png | awk '{print $1}')"
          out="/tmp/pkg-${{ steps.vars.outputs.pkgver }}"
          bash scripts/pacman/render-pkgbuild.sh \
            "${{ steps.vars.outputs.pkgver }}" \
            "${{ github.repository_owner }}" \
            "${repo_name}" \
            "${{ steps.appimage.outputs.sha256 }}" \
            "${icon_sha256}" \
            "${out}" \
            "${{ steps.appimage.outputs.path }}"
          echo "out=${out}" >> "$GITHUB_OUTPUT"

      - name: Build pacman package (container)
        id: makepkg
        shell: bash
        run: |
          set -euo pipefail
          out="${{ steps.pkg_tree.outputs.out }}"
          docker run --rm \
            -v "${out}:/pkg" \
            -w /pkg \
            archlinux:base-devel \
            bash -lc "set -euo pipefail; useradd -m builder; chown -R builder:builder /pkg; su builder -c 'makepkg -sf --noconfirm --nodeps'; ls -1 *.pkg.tar.* | head -n 1"

          pkgfile="$(ls -1 "${out}"/*.pkg.tar.* | head -n 1)"
          pkgname="$(basename "${pkgfile}")"
          echo "pkgfile=${pkgfile}" >> "$GITHUB_OUTPUT"
          echo "pkgname=${pkgname}" >> "$GITHUB_OUTPUT"

      - name: Prepare repo directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pacman-repo/x86_64

      - name: Update repo db (container)
        id: repodb
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="/tmp/pacman-repo/x86_64"
          cp -a "${{ steps.makepkg.outputs.pkgfile }}" "${repo_dir}/"

          docker run --rm \
            -v "${repo_dir}:/repo" \
            -w /repo \
            archlinux:base-devel \
            bash -lc "set -euo pipefail; pacman -Sy --noconfirm --needed pacman-contrib; repo-add -R -n warcraft-recorder-linux.db.tar.gz ./*.pkg.tar.*"

          # Replace symlinks with real files so they can be uploaded as GitHub Release assets.
          rm -f "${repo_dir}/warcraft-recorder-linux.db" "${repo_dir}/warcraft-recorder-linux.files"
          cp -f "${repo_dir}/warcraft-recorder-linux.db.tar.gz" "${repo_dir}/warcraft-recorder-linux.db"
          cp -f "${repo_dir}/warcraft-recorder-linux.files.tar.gz" "${repo_dir}/warcraft-recorder-linux.files"

          echo "repo_dir=${repo_dir}" >> "$GITHUB_OUTPUT"

      - name: Ensure pacman Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view pacman >/dev/null 2>&1; then
            # Ensure existing release is not stuck as draft (fork token workaround)
            if [ "$(gh release view pacman --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit pacman --draft=false
            fi
            exit 0
          fi
          git tag -f pacman
          git push -f origin pacman
          gh release create pacman --prerelease --title "Pacman repo" --notes "Automated pacman repo artifacts." --verify-tag
          # Fork GITHUB_TOKEN may still create a draft; ensure published
          gh release edit pacman --draft=false 2>/dev/null || true

      - name: Cleanup old package assets (keep only latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          keep="${{ steps.makepkg.outputs.pkgname }}"
          while IFS= read -r name; do
            case "${name}" in
              warcraft-recorder-linux-*.pkg.tar.*)
                if [ "${name}" != "${keep}" ]; then
                  gh release delete-asset pacman "${name}" -y || true
                fi
                ;;
            esac
          done < <(gh release view pacman --json assets --jq '.assets[].name')

      - name: Upload pacman repo artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo_dir="${{ steps.repodb.outputs.repo_dir }}"
          gh release upload pacman \
            "${repo_dir}/warcraft-recorder-linux.db" \
            "${repo_dir}/warcraft-recorder-linux.files" \
            "${repo_dir}/warcraft-recorder-linux.db.tar.gz" \
            "${repo_dir}/warcraft-recorder-linux.files.tar.gz" \
            "${repo_dir}/${{ steps.makepkg.outputs.pkgname }}" \
            --clobber
