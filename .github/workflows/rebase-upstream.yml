name: Auto-rebase on upstream

on:
  schedule:
    # Daily at 05:17 UTC.
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: auto-rebase-upstream
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git fetch --prune origin main --tags
          git remote add upstream https://github.com/aza547/wow-recorder.git 2>/dev/null || true
          git remote set-url upstream https://github.com/aza547/wow-recorder.git
          git fetch --prune upstream main --tags

      - name: Rebase onto upstream/main
        id: rebase
        run: |
          set -euo pipefail

          # We expect this workflow to run on the fork's main branch.
          git checkout main
          git reset --hard origin/main

          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

          if [ "$behind" -eq 0 ]; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          fork_removed_paths_regex='^(src/storage/CloudClient.ts|src/renderer/CloudSettings.tsx|src/renderer/PatreonButton.tsx|src/renderer/VideoChat.tsx|src/renderer/ConfirmChatNamePrompt.tsx|src/renderer/containers/ApplicationStatusCard/CloudStatus.tsx|src/renderer/containers/ApplicationStatusCard/CloudStatusCard.tsx|src/renderer/BulkTransferDialog.tsx|src/renderer/StorageFilterToggle.tsx|src/types/api.ts|src/main/Recorder.ts|src/main/AppUpdater.ts|binaries/rust-ps.exe|installer.nsh|src/renderer/WindowsSettings.tsx|src/renderer/ManualSettings.tsx|src/renderer/SceneEditor.tsx|src/renderer/RecorderPreview.tsx|src/renderer/VideoSourceControls.tsx|src/renderer/AudioSourceControls.tsx|src/renderer/VideoBaseControls.tsx|src/renderer/ChatOverlayControls.tsx|src/renderer/containers/UpdateNotifier/UpdateNotifier.tsx)$'

          rebase_failed="false"

          if ! git rebase upstream/main; then
            # Auto-resolve known fork-local conflicts (README + removed fork paths).
            while [ -d .git/rebase-apply ] || [ -d .git/rebase-merge ]; do
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              conflict_count="$(printf '%s\n' "${conflicts}" | sed '/^$/d' | wc -l | awk '{print $1}')"
              non_fork_removed_conflicts="$(printf '%s\n' "${conflicts}" | sed '/^$/d' | grep -Ev "${fork_removed_paths_regex}" || true)"

              if [ "${conflict_count}" -eq 1 ] && [ "${conflicts}" = "README.md" ]; then
                echo "Auto-resolving README.md conflict (keeping fork version)."
                git checkout --theirs README.md
                git add README.md
                if ! git rebase --continue; then
                  rebase_failed="true"
                  break
                fi
              elif [ "${conflict_count}" -gt 0 ] && [ -z "${non_fork_removed_conflicts}" ]; then
                echo "Auto-resolving fork-removed conflict(s) (enforcing pro-free/linux-only state)."
                while IFS= read -r f; do
                  [ -z "${f}" ] && continue
                  # This fork permanently removes pro-only and windows-only files.
                  # Always stage deletion so they cannot be reintroduced by upstream edits.
                  git rm -f --ignore-unmatch "${f}" || true
                done <<< "$(printf '%s\n' "${conflicts}" | sed '/^$/d')"
                if ! git rebase --continue; then
                  rebase_failed="true"
                  break
                fi
              else
                echo "Rebase conflict(s) require manual resolution:"
                printf '%s\n' "${conflicts}" | sed '/^$/d' || true
                rebase_failed="true"
                break
              fi
            done
          fi

          if [ "${rebase_failed}" = "true" ]; then
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            exit 0
          fi

          if ! bash scripts/check-no-pro.sh; then
            echo "Rebase guard failed: pro-only files or hooks reintroduced."
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! bash scripts/check-no-windows.sh; then
            echo "Rebase guard failed: Windows-only files reintroduced."
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rebase_failed=false" >> "$GITHUB_OUTPUT"

      - name: Push updated main (force-with-lease)
        if: steps.rebase.outputs.behind != '0' && steps.rebase.outputs.rebase_failed == 'false'
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:main

      - name: Open issue if rebase failed
        if: steps.rebase.outputs.rebase_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            if (!repoInfo.data.has_issues) {
              core.warning('Auto-rebase failed, but GitHub Issues are disabled for this repository.');
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const title = `Auto-rebase failed (${today})`;
            const body = [
              `The scheduled rebase of \`main\` onto \`upstream/main\` failed due to conflicts.`,
              ``,
              `Suggested fix (run locally):`,
              '```bash',
              'git fetch upstream main',
              'git checkout main',
              'git rebase upstream/main',
              '# resolve conflicts, then:',
              'git push --force-with-lease origin main',
              '```',
              ``,
              `See the failing workflow run logs for details.`,
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const alreadyOpen = existing.find((i) => i.title === title);
            if (alreadyOpen) return;

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });

      - name: Fail if rebase failed
        if: steps.rebase.outputs.rebase_failed == 'true'
        run: |
          echo "Auto-rebase failed; see the conflict list above."
          exit 1
