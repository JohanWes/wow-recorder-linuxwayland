# SPDX-License-Identifier: GPL-2.0-only

[package]
name = "warcraft-recorder"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "warcraft-recorder"
path = "src/main.rs"

[dependencies]
gtk4 = "0.11.4"
libadwaita = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
