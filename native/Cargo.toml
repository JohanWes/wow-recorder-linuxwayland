# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "warcraft-recorder"
version = "1.0.9"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "warcraft-recorder"
path = "src/main.rs"

[dependencies]
clapper = { package = "clapper-player", version = "=0.10.1", features = ["v0_10"] }
clapper-gtk = { package = "clapper-player-gtk", version = "=0.10.1", features = ["v0_10"] }
gtk4 = { version = "0.11.4", features = ["v4_10"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
libadwaita = { version = "0.9.2", features = ["v1_6"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.18", features = ["v4"] }

[features]
development = []
