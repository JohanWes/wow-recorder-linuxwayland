name: ffmpeg
config-opts:
  - --enable-gpl
  - --enable-version3
  - --enable-shared
  - --disable-static
  - --disable-debug
  - --disable-doc
  - --disable-network
  - --disable-autodetect
  - --disable-everything
  - --disable-ffplay
  - --disable-ffprobe
  - --enable-ffmpeg
  - --enable-avcodec
  - --enable-avfilter
  - --enable-avformat
  - --enable-swresample
  - --enable-swscale
  - --enable-protocol=file,pipe
  - --enable-demuxer=concat,matroska,mov
  - --enable-muxer=matroska,mp4
  - --enable-decoder=aac,h264,hevc,libdav1d
  - --enable-encoder=aac,libx264,h264_nvenc,hevc_nvenc,av1_nvenc,h264_vaapi,hevc_vaapi,av1_vaapi,h264_vulkan,hevc_vulkan,av1_vulkan
  - --enable-parser=aac,av1,h264,hevc
  - --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb
  - --enable-filter=afade,aformat,amix,aresample,asetpts,atrim,concat,fade,format,fps,pad,scale,setpts,trim
  - --enable-ffnvcodec
  - --enable-libdav1d
  - --enable-libx264
  - --enable-nvenc
  - --enable-vaapi
  - --enable-vulkan
cleanup:
  - /share/ffmpeg/examples
post-install:
  - install -Dm644 COPYING.GPLv3 /app/share/licenses/$FLATPAK_ID/FFmpeg-COPYING.GPLv3
sources:
  # The official release tarball on ffmpeg.org is the only byte-identical
  # copy of itself and ffmpeg.org has a history of outages, so fetch the
  # equivalent n8.0.1 tag tree from the project's official GitHub mirror.
  # The tag tree differs from the release tarball only by inert files
  # (.gitignore, VERSION, one FATE reference); version.sh falls back to the
  # RELEASE file, so FFMPEG_VERSION stays "8.0.1".
  - type: archive
    url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n8.0.1.tar.gz
    sha256: 679aa13a19415d5ddab91e580084e3ab20c963c8240001e5cbb955a97bdd81b1
modules:
  - name: nv-codec-headers
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    post-install:
      - mkdir -p /app/share/licenses/$FLATPAK_ID/nv-codec-headers
      - cp -a include/ffnvcodec/*.h /app/share/licenses/$FLATPAK_ID/nv-codec-headers/
    cleanup:
      - /include/ffnvcodec
      - /lib/pkgconfig/ffnvcodec.pc
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        commit: e844e5b26f46bb77479f063029595293aa8f812d
        tag: n13.0.19.0
  - name: x264
    no-autogen: true
    config-opts:
      - --disable-cli
      - --enable-shared
      - --disable-opencl
      - --disable-bashcompletion
      - --enable-strip
    make-install-args:
      - PREFIX=/app
    post-install:
      - install -Dm644 COPYING /app/share/licenses/$FLATPAK_ID/x264-COPYING
    sources:
      # code.videolan.org is the upstream host but has a history of
      # connectivity failures, and the github.com/mirror/x264 mirror's full
      # history is tree-incomplete (a treeless-clone artifact), so a git
      # checkout of this commit fails there. The mirror's commit archive
      # carries the identical tree (verified against the pinned commit) and
      # is served from GitHub.
      - type: archive
        url: https://github.com/mirror/x264/archive/b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.gz
        sha256: cd71a7515b0e9a012e1ac9b1f8415bebcaf6fc97d4db32286642ac4c0fbe24f9
