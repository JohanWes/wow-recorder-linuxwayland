name: ffmpeg
config-opts:
  - --enable-version3
  - --enable-shared
  - --disable-static
  - --disable-debug
  - --disable-doc
  - --disable-network
  - --disable-autodetect
  - --disable-everything
  - --disable-ffplay
  - --disable-ffprobe
  - --enable-ffmpeg
  - --enable-avcodec
  - --enable-avfilter
  - --enable-avformat
  - --enable-swresample
  - --disable-swscale
  - --disable-avdevice
  - --enable-protocol=file,pipe
  - --enable-demuxer=concat,matroska,mov
  - --enable-muxer=matroska,mp4
  - --enable-decoder=aac,h264,hevc,libdav1d
  - --enable-encoder=aac,h264_nvenc,hevc_nvenc,av1_nvenc,h264_vaapi,hevc_vaapi,av1_vaapi,h264_vulkan,hevc_vulkan,av1_vulkan
  - --enable-parser=aac,av1,h264,hevc
  - --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb
  # gpu-screen-recorder mixes audio sources with amix; abuffer and
  # abuffersink are always built. The app itself only stream-copies.
  - --enable-filter=amix,aformat,aresample
  - --enable-ffnvcodec
  - --enable-libdav1d
  - --enable-nvenc
  - --enable-vaapi
  - --enable-vulkan
cleanup:
  - /share/ffmpeg
post-install:
  - install -Dm644 COPYING.LGPLv3 /app/share/licenses/$FLATPAK_ID/FFmpeg-COPYING.LGPLv3
sources:
  # The official release tarball on ffmpeg.org is the only byte-identical
  # copy of itself and ffmpeg.org has a history of outages, so fetch the
  # equivalent n8.0.1 tag tree from the project's official GitHub mirror.
  # The tag tree differs from the release tarball only by inert files
  # (.gitignore, VERSION, one FATE reference); version.sh falls back to the
  # RELEASE file, so FFMPEG_VERSION stays "8.0.1".
  - type: archive
    url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n8.0.1.tar.gz
    sha256: 679aa13a19415d5ddab91e580084e3ab20c963c8240001e5cbb955a97bdd81b1
modules:
  - name: nv-codec-headers
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    post-install:
      - mkdir -p /app/share/licenses/$FLATPAK_ID/nv-codec-headers
      # Each header opens with its own MIT notice; ship the notices, not the headers.
      - for f in include/ffnvcodec/*.h; do sed -n '1,/\*\//p' "$f" > /app/share/licenses/$FLATPAK_ID/nv-codec-headers/$(basename "$f").txt; done
    cleanup:
      - /include/ffnvcodec
      - /lib/pkgconfig/ffnvcodec.pc
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        commit: e844e5b26f46bb77479f063029595293aa8f812d
        tag: n13.0.19.0
