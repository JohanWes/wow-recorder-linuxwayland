name: gpu-screen-recorder
buildsystem: meson
builddir: true
config-opts:
  - --buildtype=release
  - -Dcapabilities=false
  - -Dsystemd=false
  - -Dnvidia_suspend_fix=false
  - -Dportal=true
  - -Dapp_audio=false
  - -Dplugin_examples=false
post-install:
  - rm -f /app/bin/gsr-kms-server
  - install -Dm644 ../LICENSE /app/share/licenses/$FLATPAK_ID/gpu-screen-recorder-LICENSE
sources:
  - type: archive
    url: https://dec05eba.com/snapshot/gpu-screen-recorder.git.5.13.9.tar.gz
    sha256: a09365f687002c87f99bcaa4665be1bd0188fa4358f437368fc6a95ab50f4d78
    strip-components: 0
  - type: patch
    path: gsr-run-hooks-in-sandbox.patch
